{% extends "base.html" %}
{% block content %}
<form class="panel form login" method="post" action="/login">
  <div class="login-logo"><img src="/static/favicon.svg" alt="" width="56" height="56"></div>
  <h1>{{ t('app_name') }}</h1>
  <label>{{ t('password') }}<input type="password" name="password" autofocus required autocomplete="current-password"></label>
  {% if error %}<p class="error">{{ t('bad_password') }}</p>{% endif %}
  <button class="btn primary">{{ t('login') }}</button>
</form>
{% endblock %}
